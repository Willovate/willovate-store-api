name: willovate-store

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-willovate_store}
      POSTGRES_USER: ${POSTGRES_USER:-willovate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-willovate_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-willovate} -d ${POSTGRES_DB:-willovate_store}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Willovate.Store.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Store: Host=postgres;Port=5432;Database=${POSTGRES_DB:-willovate_store};Username=${POSTGRES_USER:-willovate};Password=${POSTGRES_PASSWORD:-willovate_dev}
      Cors__AllowedOrigins__0: ${STORE_UI_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-5191}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
